<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#0099CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066CC;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background rounded rectangle with gradient -->
  <rect x="2" y="2" width="28" height="28" rx="5.6" ry="5.6" 
        fill="url(#logoGradient)" 
        filter="url(#glow)"/>
  
  <!-- Trending up arrow icon -->
  <g fill="white" transform="translate(8, 8)">
    <!-- Arrow line -->
    <path d="M2 14 L14 2" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <!-- Arrow head -->
    <path d="M9 2 L14 2 L14 7" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Data points -->
    <circle cx="4" cy="12" r="1.5" fill="white"/>
    <circle cx="8" cy="8" r="1.5" fill="white"/>
    <circle cx="12" cy="4" r="1.5" fill="white"/>
  </g>
</svg>

name: elevate_360
description: "Elevate-360 - Employee Performance Monitoring System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^3.15.1
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.11
  firebase_storage: ^12.4.9
  firebase_messaging: ^15.2.9
  firebase_analytics: ^11.5.2
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # UI Components
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^3.3.1
  
  # Navigation
  go_router: ^16.0.0
  
  # HTTP & Data
  dio: ^5.4.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.2.2
  
  # File & Media
  image_picker: ^1.0.4
  file_picker: ^10.2.0
  path_provider: ^2.1.1
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.2.1
  url_launcher: ^6.2.2
  permission_handler: ^12.0.1
  connectivity_plus: ^6.1.4
  
  # Animation
  flutter_animate: ^4.3.0
  fl_chart: ^1.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  
  # Linting
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

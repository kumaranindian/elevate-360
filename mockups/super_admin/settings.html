<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System Settings - Elevate-360 mockup</title><link rel="stylesheet" href="../assets/mock.css"></head><body data-role="super_admin" data-title="System Settings"><main>
<div class="head"><div><h1>System Settings</h1></div><a class="btn p">Save</a></div>
<div class="grid g2"><div class="card"><h2>Security</h2><div class="f"><label>Session timeout</label><select><option>30 minutes</option></select></div><div class="f"><label>Require MFA for</label><select><option>HR, Finance, Admin</option></select></div></div>
<div class="card"><h2>Feature flags</h2><div class="list"><div><span>360 feedback</span><span class="badge b-ok">On</span></div><div><span>Payroll</span><span class="badge b-ok">On</span></div><div><span>Recruiting</span><span class="badge">Off</span></div><div><span>Attendance and leave</span><span class="badge b-ok">On</span></div></div></div>
<div class="card"><h2>Data retention</h2><div class="f"><label>Keep closed review cycles for</label><select><option>7 years</option></select></div></div>
<div class="card"><h2>Integrations</h2><div class="list"><div><span>Google Workspace SSO</span><span class="badge b-ok">Connected</span></div><div><span>Slack notifications</span><span class="badge">Not connected</span></div></div></div></div>

</main><script src="../assets/mock.js"></script></body></html>
